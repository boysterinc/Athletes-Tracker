<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar v5.6 - Smart Screening</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
    .device-name { color: #FFFFFF !important; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; }
    .item-card { background: #111827; border-left: 5px solid #374151; margin-bottom: 6px; padding: 12px; border-radius: 12px; transition: 0.3s; }
    .highlight-card { border-left: 5px solid #fbbf24 !important; background-color: #451a03 !important; } /* สีส้มช่วงคัดกรอง */
    .whitelist-card { border-left: 5px solid #ef4444 !important; background-color: #1e1b4b !important; } /* สีแดงเมื่อยืนยัน */
    .progress-bar { height: 4px; background: #374151; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 1s linear; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: #1f2937; padding: 24px; width: 100%; max-width: 360px; border-radius: 24px; border: 1px solid #374151; }
  </style>
</head>
<body class="p-4">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
      <div>
        <h1 class="text-lg font-black text-blue-500 italic uppercase tracking-tighter">Team Radar v5.6</h1>
        <p class="text-[9px] text-yellow-500 font-bold uppercase italic">Dynamic Screening System</p>
      </div>
      <div id="statusTag" class="bg-red-900 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase">OFF</div>
    </header>

    <div class="mb-4 bg-gray-900 p-4 rounded-2xl border border-gray-700 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <label class="text-[10px] text-blue-400 font-black uppercase italic">Target Devices (In Box)</label>
        <input id="targetCount" type="number" value="1" min="1" max="10" class="w-12 bg-gray-800 border border-gray-600 rounded text-center text-white font-bold">
      </div>
      
      <div id="filterStatus" class="hidden mb-3">
        <div class="flex justify-between text-[10px] mb-1 uppercase font-bold">
          <span id="stepLabel" class="text-yellow-500 italic">Phase 1: Stay Close (< 30cm)</span>
          <span id="timerLabel">30s</span>
        </div>
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      </div>

      <button id="screenBtn" class="w-full bg-yellow-600 py-3 rounded-xl font-black uppercase text-xs shadow-lg active:scale-95 transition">Start Smart Screening</button>
      <div id="screenInfo" class="mt-2 text-[8px] text-gray-500 text-center uppercase font-bold italic">
        วางโทรศัพท์ใกล้กล่องนาฬิกา < 30 ซม. แล้วกดเริ่ม
      </div>
    </div>

    <div class="mb-4 bg-gray-900 p-3 rounded-xl border border-gray-800">
      <div class="flex justify-between items-center mb-2">
        <label class="text-[9px] text-red-500 font-black italic">CONFIRMED TEAM</label>
        <button onclick="clearTeam()" class="text-[9px] text-gray-600 underline">Clear All</button>
      </div>
      <div id="teamBadges" class="flex flex-wrap gap-2"></div>
    </div>

    <div id="listArea">
      <div class="flex justify-between text-[9px] text-gray-600 mb-2 font-black italic uppercase">
        <span id="radarLabel">Nearby Signals</span>
        <span id="deviceCount">0 Found</span>
      </div>
      <div id="deviceList" class="space-y-1.5"></div>
    </div>
  </div>

  <script>
    const DEFAULT_TX = -59;
    let devices = new Map();
    let teamList = [];
    let bluetoothScan = null;
    let screeningMode = "OFF"; // OFF, PHASE1, PHASE2
    let screenTimer = 0;
    let candidates = new Map(); // {id: initialRSSI}

    window.onload = () => {
      const saved = localStorage.getItem('morboy_team_v5_6');
      if (saved) { try { teamList = JSON.parse(saved); renderTeamBadges(); } catch(e) { teamList = []; } }
    };

    function renderTeamBadges() {
      const container = document.getElementById('teamBadges');
      if (teamList.length === 0) { container.innerHTML = '<span class="text-[9px] text-gray-700 italic">No athletes confirmed.</span>'; return; }
      const uniqueNames = [...new Set(teamList.map(m => m.name))];
      container.innerHTML = uniqueNames.map(name => `<div class="team-badge bg-blue-900 border border-blue-500 px-3 py-1 rounded-full text-[10px] font-bold">${name}</div>`).join('');
    }

    async function startSmartScreening() {
      try {
        const target = parseInt(document.getElementById('targetCount').value);
        if (bluetoothScan) await bluetoothScan.stop();
        
        bluetoothScan = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: true });
        navigator.bluetooth.addEventListener('advertisementreceived', handleSignal);

        // Start Phase 1
        screeningMode = "PHASE1";
        screenTimer = 15; // 15 วินาทีแรกให้เก็บข้อมูลระยะใกล้
        updateUI();
        
        const countdown = setInterval(() => {
          screenTimer--;
          updateProgress(screenTimer, 30);
          
          if (screenTimer === 15) {
            // สั่งให้หมอบอยเดินห่างออกไป
            screeningMode = "PHASE2";
            document.getElementById('stepLabel').innerText = "Phase 2: MOVE AWAY (5-10m)!";
            document.getElementById('stepLabel').className = "text-blue-400 italic";
            alert("จังหวะนี้ให้หมอบอยเดินถือโทรศัพท์ห่างจากกล่องนาฬิกา 5-10 เมตรครับ!");
          }

          if (screenTimer <= 0) {
            clearInterval(countdown);
            finishScreening();
          }
        }, 1000);

      } catch (e) { alert(e.message); }
    }

    function handleSignal(event) {
      const id = event.device.id;
      const name = event.device.name || "Unknown";
      const rssi = event.rssi;
      const time = Date.now();
      devices.set(id, { id, name, rssi, time });

      // ช่วง Phase 1: เก็บข้อมูลตัวที่แรงที่สุดเข้า Candidate
      if (screeningMode === "PHASE1" && rssi > -50) {
        if (!candidates.has(id)) candidates.set(id, { initialRSSI: rssi, name });
      }
      
      render();
    }

    function finishScreening() {
      const target = parseInt(document.getElementById('targetCount').value);
      const confirmed = [];
      
      // คัดกรอง: ตัวไหนที่ RSSI ยังใกล้เคียงกับตอนเริ่ม (เพราะมันเดินตามมาในกล่อง)
      for (let [id, data] of candidates) {
        const current = devices.get(id);
        if (current && Math.abs(current.rssi - data.initialRSSI) < 15) {
          // คำนวณ P0 แบบ v5.5 (30cm standard)
          const p0 = data.initialRSSI - (10 * 2.0 * -0.5228); 
          confirmed.push({ id, name: data.name, tx: p0 });
        }
      }

      // เลือกเฉพาะตัวที่แรงที่สุดตามจำนวน Target
      const finalSelection = confirmed.slice(0, target);
      teamList = [...teamList, ...finalSelection];
      
      localStorage.setItem('morboy_team_v5_6', JSON.stringify(teamList));
      screeningMode = "OFF";
      document.getElementById('filterStatus').classList.add('hidden');
      document.getElementById('screenBtn').innerText = "Screening Complete!";
      renderTeamBadges();
      alert(`คัดกรองเสร็จสิ้น! พบนักกีฬาตัวจริง ${finalSelection.length} เครื่อง`);
    }

    function updateUI() {
      document.getElementById('filterStatus').classList.remove('hidden');
      document.getElementById('screenBtn').disabled = true;
      document.getElementById('screenBtn').innerText = "Screening In Progress...";
      document.getElementById('screenBtn').className = "w-full bg-gray-800 py-3 rounded-xl font-black uppercase text-xs opacity-50";
    }

    function updateProgress(current, total) {
      const perc = ((total - current) / total) * 100;
      document.getElementById('progressFill').style.width = perc + "%";
      document.getElementById('timerLabel').innerText = current + "s";
    }

    function render() {
      const now = Date.now();
      const n = 2.0; 
      const limit = parseInt(document.getElementById('targetCount').value) + 5;

      for (let [id, data] of devices) { if (now - data.time > 8000) devices.delete(id); }
      
      const all = Array.from(devices.values()).map(d => {
        const member = teamList.find(m => m.id === d.id);
        const tx = member ? member.tx : DEFAULT_TX;
        const dist = Math.pow(10, (tx - d.rssi) / (10 * n));
        const isCandidate = candidates.has(d.id);
        return { ...d, dist, isTeam: !!member, isCandidate };
      });

      const sorted = all.sort((a, b) => a.dist - b.dist).slice(0, 15);
      document.getElementById('deviceCount').innerText = `${all.length} Total`;
      
      document.getElementById('deviceList').innerHTML = sorted.map(d => `
        <div class="item-card ${d.isTeam ? 'whitelist-card' : (d.isCandidate ? 'highlight-card' : '')} flex justify-between items-center">
          <div class="flex-1">
            <div class="flex items-center space-x-2">
              ${d.isTeam ? '<span class="text-[8px] bg-red-600 px-1 rounded font-black italic">TEAM</span>' : (d.isCandidate ? '<span class="text-[8px] bg-yellow-600 px-1 rounded font-black text-black">IN BOX</span>' : '')}
              <span class="device-name">${d.name}</span>
            </div>
            <div class="text-[9px] font-mono text-gray-500">${d.id}</div>
          </div>
          <div class="text-right">
            <div class="text-2xl font-black ${d.isTeam ? 'text-red-500' : 'text-blue-500'}">${d.dist.toFixed(1)}m</div>
            <div class="text-[9px] text-gray-600 font-bold">${d.rssi} dBm</div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('screenBtn').addEventListener('click', startSmartScreening);
    function clearTeam() { if(confirm('Clear all?')) { teamList = []; localStorage.removeItem('morboy_team_v5_6'); renderTeamBadges(); render(); } }
  </script>
</body>
</html>
