<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar Pro v4.1 - Mor Boy</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; font-family: sans-serif; }
    .status-on { background-color: #059669; }
    .status-off { background-color: #991b1b; }
    .item-card { background-color: #111827; border-left: 4px solid #3b82f6; margin-bottom: 8px; padding: 12px; border-radius: 12px; transition: all 0.3s ease; }
    .whitelist-card { border-left: 4px solid #ef4444; background-color: #1e1b4b; }
    .id-text { font-family: monospace; color: #6b7280; font-size: 10px; }
    .highlight-id { color: #ef4444; font-weight: bold; }
    input::placeholder { color: #374151; }
  </style>
</head>
<body class="p-4">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
      <h1 class="text-lg font-bold text-blue-500 italic">TEAM RADAR v4.1</h1>
      <div id="statusTag" class="status-off text-[10px] px-2 py-1 rounded-full font-bold uppercase">OFF</div>
    </header>

    <div class="grid grid-cols-2 gap-2 mb-4">
      <div class="bg-gray-900 p-2 rounded-xl border border-gray-800">
        <label class="text-[9px] text-gray-400 uppercase block mb-1 font-bold">Environment</label>
        <select id="envMode" class="w-full bg-transparent text-xs text-blue-400 outline-none font-bold">
          <option value="2.0">Open Field (2.0)</option>
          <option value="2.7">Stadium (2.7)</option>
          <option value="3.5">Indoor (3.5)</option>
        </select>
      </div>
      <div class="bg-gray-900 p-2 rounded-xl border border-gray-800">
        <label class="text-[9px] text-gray-400 uppercase block mb-1 font-bold italic text-red-500">Auto-Save White List</label>
        <input type="text" id="filterInput" placeholder="ID หรือ ชื่อ..." class="w-full bg-transparent text-xs text-white outline-none">
      </div>
    </div>

    <div class="flex space-x-2 mb-6">
      <button id="startBtn" class="flex-1 bg-blue-600 py-4 rounded-2xl font-black uppercase text-sm shadow-lg active:scale-95 transition">Start Radar</button>
      <button id="stopBtn" class="hidden flex-none bg-gray-800 px-6 py-4 rounded-2xl font-black uppercase text-sm shadow-lg">Stop</button>
    </div>

    <div id="listArea">
      <div class="flex justify-between text-[10px] text-gray-500 mb-2 uppercase font-bold px-1">
        <span>Detected Athletes</span>
        <span id="deviceCount">Total: 0</span>
      </div>
      <div id="deviceList" class="space-y-2">
        <p class="text-center text-gray-800 py-10 italic">Ready to Scan...</p>
      </div>
    </div>
  </div>

  <script>
    const TX_POWER = -59;
    let devices = new Map();
    let bluetoothScan = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusTag = document.getElementById('statusTag');
    const deviceList = document.getElementById('deviceList');
    const filterInput = document.getElementById('filterInput');

    // --- ระบบ Local Storage ---
    // โหลดข้อมูลเก่าทันทีที่เปิดหน้าเว็บ
    window.onload = () => {
      const savedFilter = localStorage.getItem('morboy_whitelist');
      if (savedFilter) {
        filterInput.value = savedFilter;
        console.log("Loaded White List from memory:", savedFilter);
      }
    };

    // บันทึกข้อมูลทุกครั้งที่มีการพิมพ์
    filterInput.oninput = () => {
      localStorage.setItem('morboy_whitelist', filterInput.value);
    };
    // -------------------------

    startBtn.onclick = async () => {
      try {
        bluetoothScan = await navigator.bluetooth.requestLEScan({
          acceptAllAdvertisements: true,
          keepRepeatedDevices: true
        });

        statusTag.innerText = "ON";
        statusTag.className = "status-on text-[10px] px-2 py-1 rounded-full font-bold";
        startBtn.innerText = "SCANNING ACTIVE";
        startBtn.disabled = true;
        stopBtn.classList.remove('hidden');

        navigator.bluetooth.addEventListener('advertisementreceived', handleSignal);
      } catch (e) {
        alert("Radar Error: " + e.message);
      }
    };

    stopBtn.onclick = () => {
      if (bluetoothScan) bluetoothScan.stop();
      location.reload();
    };

    function handleSignal(event) {
      const id = event.device.id;
      const name = event.device.name || "Unknown";
      const rssi = event.rssi;
      const env = parseFloat(document.getElementById('envMode').value);
      const filter = filterInput.value.trim().toLowerCase();

      const dist = Math.pow(10, (TX_POWER - rssi) / (10 * env));
      
      // เช็ค White List
      let isWhiteListed = false;
      if (filter) {
        // รองรับการใส่หลายชื่อโดยใช้เว้นวรรค
        const filterTerms = filter.split(/\s+/);
        isWhiteListed = filterTerms.some(term => 
          id.toLowerCase().includes(term) || 
          name.toLowerCase().includes(term)
        );
      }

      devices.set(id, { id, name, rssi, dist, isWhiteListed, time: Date.now() });
      render();
    }

    function render() {
      const now = Date.now();
      for (let [id, data] of devices) {
        if (now - data.time > 8000) devices.delete(id);
      }

      const allDevices = Array.from(devices.values());
      const whiteListItems = allDevices.filter(d => d.isWhiteListed);
      const generalItems = allDevices
        .filter(d => !d.isWhiteListed)
        .sort((a, b) => a.dist - b.dist);

      const displayItems = [...whiteListItems, ...generalItems].slice(0, 10);
      document.getElementById('deviceCount').innerText = "Total: " + devices.size;

      if (displayItems.length === 0) {
        deviceList.innerHTML = '<p class="text-center text-gray-800 py-10 italic">Scanning for signals...</p>';
        return;
      }

      deviceList.innerHTML = displayItems.map((d) => `
        <div class="item-card ${d.isWhiteListed ? 'whitelist-card' : ''} flex justify-between items-center shadow-md">
          <div class="flex-1 overflow-hidden pr-2 text-left">
            <div class="flex items-center space-x-2">
              ${d.isWhiteListed ? '<span class="text-[8px] bg-red-600 px-1 rounded text-white font-bold uppercase">Athlete</span>' : ''}
              <span class="text-sm font-black truncate">${d.name}</span>
            </div>
            <div class="id-text">ID: <span class="${d.isWhiteListed ? 'highlight-id' : ''}">${d.id}</span></div>
            <div class="text-[9px] text-gray-600 font-mono">${d.rssi} dBm</div>
          </div>
          <div class="text-right">
            <div class="text-2xl font-black ${d.isWhiteListed ? 'text-red-500' : 'text-blue-400'}">${d.dist.toFixed(1)}<span class="text-[10px] ml-1 text-gray-500 font-normal">m</span></div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
