<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar - Mor Boy Edition</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .radar-pulse { animation: radar-wave 2s infinite ease-out; }
    @keyframes radar-wave { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 100% { box-shadow: 0 0 0 30px rgba(59, 130, 246, 0); } }
    .device-card { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-black text-white p-4 font-sans min-h-screen">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-blue-500">ATHLETE RADAR</h1>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest">Passive Scanning Mode</p>
      </div>
      <div id="scanStatus" class="text-[10px] bg-red-900 px-3 py-1 rounded-full text-white font-bold">OFF</div>
    </header>

    <div class="mb-4">
      <label class="text-[10px] text-gray-500 uppercase font-bold mb-2 block">Environment Mode</label>
      <select id="envMode" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 px-3 text-sm text-blue-400">
        <option value="2.0">สนามกลางแจ้ง (Open Field)</option>
        <option value="2.7">สนามกีฬาคนเยอะ (Crowded Stadium)</option>
        <option value="3.5">ในอาคาร (Indoor/Obstacles)</option>
      </select>
    </div>

    <button onclick="startRadarScan()" id="radarBtn" class="w-full mb-6 bg-blue-600 hover:bg-blue-500 text-white font-black py-6 rounded-3xl shadow-lg uppercase tracking-widest transition active:scale-95">
      Start Passive Radar
    </button>

    <div id="resultsArea" class="space-y-4">
      <div class="bg-gray-900 rounded-3xl p-6 border border-gray-700 relative overflow-hidden" id="mainDisplay">
        <p class="text-[10px] text-gray-500 uppercase font-bold mb-2">Nearest Athlete</p>
        <h2 id="nearestName" class="text-2xl font-black text-white italic truncate">Waiting...</h2>
        
        <div class="grid grid-cols-2 gap-4 mt-6">
          <div class="bg-black bg-opacity-40 p-4 rounded-2xl border border-gray-800">
            <p class="text-[10px] text-gray-500 uppercase font-bold">Distance</p>
            <p class="text-2xl font-black text-blue-400"><span id="distDisplay">--</span> <span class="text-xs font-normal">m</span></p>
          </div>
          <div class="bg-black bg-opacity-40 p-4 rounded-2xl border border-gray-800">
            <p class="text-[10px] text-gray-500 uppercase font-bold">Signal (RSSI)</p>
            <p class="text-2xl font-black text-yellow-500"><span id="rssiDisplay">--</span> <span class="text-xs font-normal">dBm</span></p>
          </div>
        </div>
      </div>
    </div>

    <p class="text-[10px] text-gray-600 mt-8 text-center italic uppercase">
      *Requires Chrome Android with Experimental Features Enabled
    </p>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRGLwwocunBFN7i-nBra8uKjet3S4sx1qGDowxsYmrNS6ziPY_Z3UkzNdAE18QNcVV4Q/exec";
    const TX_POWER = -59; // RSSI อ้างอิงที่ระยะ 1 เมตร

    async function startRadarScan() {
      const statusLabel = document.getElementById('scanStatus');
      const radarBtn = document.getElementById('radarBtn');

      if (!('bluetooth' in navigator) || !navigator.bluetooth.requestLEScan) {
        alert("เบราว์เซอร์นี้ไม่รองรับระบบ Radar Scan กรุณาใช้ Chrome Android และเปิด Experimental Flag");
        return;
      }

      try {
        statusLabel.innerText = "RADAR ON";
        statusLabel.className = "text-[10px] bg-green-600 px-3 py-1 rounded-full text-white font-bold";
        radarBtn.innerText = "RADAR ACTIVE...";
        radarBtn.classList.add('radar-pulse');
        radarBtn.disabled = true;

        // เริ่มต้นการดักฟัง (Passive Scanning)
        const scan = await navigator.bluetooth.requestLEScan({
          acceptAllAdvertisements: true,
