<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar v5.1 - Ultra Stable</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
    .device-name { color: #FFFFFF !important; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; line-height: 1.2; word-break: break-all; }
    .id-text-full { font-family: monospace; color: #9ca3af; font-size: 10px; line-height: 1.2; margin-top: 4px; word-break: break-all; }
    .item-card { background: #111827; border-left: 5px solid #374151; margin-bottom: 6px; padding: 12px; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .whitelist-card { border-left: 5px solid #ef4444 !important; background-color: #1e1b4b !important; }
    .team-badge { background: #1e1b4b; border: 1px solid #3b82f6; color: #fff; padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; margin-bottom: 4px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: #1f2937; padding: 24px; width: 100%; max-width: 360px; border-radius: 20px; border: 1px solid #374151; max-height: 90vh; overflow-y: auto; }
    .select-btn { background: #2d3748; border: 1px solid #4a5568; padding: 10px; border-radius: 12px; margin-bottom: 8px; text-align: left; width: 100%; transition: 0.2s; }
  </style>
</head>
<body class="p-4">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
      <div>
        <h1 class="text-lg font-black text-blue-500 italic uppercase tracking-tighter">Team Radar v5.1</h1>
        <p class="text-[9px] text-gray-500 font-bold uppercase italic">Ultra Stable Mode</p>
      </div>
      <div id="statusTag" class="bg-red-900 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase">OFF</div>
    </header>

    <div class="mb-4 bg-gray-900 p-3 rounded-xl border border-gray-800">
      <div class="flex justify-between items-center mb-2">
        <label class="text-[9px] text-red-500 uppercase font-black italic tracking-wider">Team Whitelist</label>
        <button onclick="clearTeam()" class="text-[9px] text-gray-600 underline font-bold">Clear All</button>
      </div>
      <div id="teamBadges" class="flex flex-wrap gap-2"></div>
    </div>

    <div class="grid grid-cols-3 gap-2 mb-3">
      <div class="bg-gray-800 p-2 rounded-lg border border-gray-700">
        <label class="text-[8px] text-gray-500 block font-bold uppercase italic">Env</label>
        <select id="envMode" class="w-full bg-transparent text-xs text-blue-400 font-bold outline-none">
          <option value="2.0">Open Field</option>
          <option value="2.7">Stadium</option>
          <option value="3.5">Indoor</option>
        </select>
      </div>
      <div class="bg-gray-800 p-2 rounded-lg border border-gray-700">
        <label class="text-[8px] text-gray-500 block font-bold uppercase italic">Show</label>
        <select id="displayLimit" class="w-full bg-transparent text-xs text-green-400 font-bold outline-none" onchange="render()">
          <option value="10">10 Devices</option>
          <option value="20">20 Devices</option>
          <option value="30">30 Devices</option>
        </select>
      </div>
      <div class="bg-gray-800 p-2 rounded-lg border border-gray-700">
        <label class="text-[8px] text-gray-500 block font-bold uppercase italic">Search</label>
        <input type="text" id="quickSearch" placeholder="..." class="w-full bg-transparent text-xs text-white outline-none">
      </div>
    </div>

    <button id="startBtn" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase text-sm mb-2 shadow-lg active:scale-95 transition">Start Scanning</button>
    <button id="stopBtn" class="w-full bg-gray-800 py-2 rounded-xl font-bold uppercase text-[10px] mb-4 border border-gray-700">Stop & Refresh Page</button>

    <div id="listArea">
      <div class="flex justify-between text-[9px] text-gray-600 mb-2 uppercase font-black px-1 italic">
        <span>Nearby Devices</span>
        <span id="deviceCount">0 Found</span>
      </div>
      <div id="deviceList" class="space-y-1.5">
        <p class="text-center text-gray-800 py-10 italic">Ready to Scan...</p>
      </div>
    </div>
  </div>

  <div id="mapModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 class="text-blue-500 font-black text-lg mb-1 uppercase italic">ID MAPPING</h2>
      <p id="targetIDDisp" class="text-[9px] text-gray-500 mb-4 font-mono break-all"></p>
      <div class="mb-4">
        <p class="text-[10px] text-red-500 font-bold uppercase mb-2">Link to Athlete:</p>
        <div id="athleteOptions" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      </div>
      <div class="border-t border-gray-700 pt-4">
        <button onclick="promptNewAthlete()" class="w-full bg-blue-600 py-3 rounded-xl font-bold uppercase text-xs mb-2">+ Register New Athlete</button>
        <button onclick="closeModal()" class="w-full bg-gray-700 py-3 rounded-xl font-bold uppercase text-xs">Cancel</button>
      </div>
    </div>
  </div>

  <div id="detailModal" class="modal" onclick="closeModal()">
    <div class="modal-content text-center" onclick="event.stopPropagation()">
      <h2 class="text-red-500 font-black text-lg mb-4 uppercase italic border-b border-gray-700 pb-2">Athlete Details</h2>
      <div class="bg-black/50 p-4 rounded-xl mb-6 text-left">
        <p class="text-[9px] text-gray-500 uppercase font-bold mb-1">Name</p>
        <p id="modalName" class="text-white font-bold text-base break-all mb-4 uppercase">Device Name</p>
        <p class="text-[9px] text-gray-500 uppercase font-bold mb-1">Linked IDs</p>
        <p id="modalID" class="text-blue-400 font-mono text-[10px] break-all"></p>
      </div>
      <div class="flex gap-2">
          <button onclick="closeModal()" class="flex-1 bg-gray-700 py-3 rounded-lg font-bold uppercase text-xs">Close</button>
          <button id="modalDeleteBtn" class="flex-none bg-red-900 px-4 py-3 rounded-lg font-bold uppercase text-xs">Remove</button>
      </div>
    </div>
  </div>

  <script>
    const TX_POWER = -59;
    let devices = new Map();
    let teamList = [];
    let bluetoothScan = null;
    let currentMappingID = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusTag = document.getElementById('statusTag');
    const deviceList = document.getElementById('deviceList');
    const teamBadges = document.getElementById('teamBadges');

    window.onload = () => {
      const saved = localStorage.getItem('morboy_team_stable');
      if (saved) { try { teamList = JSON.parse(saved); renderTeamBadges(); } catch(e) {
