<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar Top 10 - Mor Boy</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; font-family: sans-serif; }
    .radar-pulse { animation: radar-wave 2s infinite ease-out; }
    @keyframes radar-wave { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); } 100% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); } }
    .device-item { transition: all 0.5s ease; border-left: 4px solid #3b82f6; }
    .top-1 { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
  </style>
</head>
<body class="p-4 min-h-screen">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-blue-500 italic">ATHLETE RADAR</h1>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Top 10 Passive Scanning</p>
      </div>
      <div id="scanStatus" class="text-[10px] bg-red-900 px-3 py-1 rounded-full text-white font-bold uppercase">OFF</div>
    </header>

    <div class="mb-4 bg-gray-900 p-3 rounded-2xl border border-gray-800">
      <label class="text-[10px] text-gray-500 uppercase font-bold mb-1 block">Environment Mode</label>
      <select id="envMode" class="w-full bg-transparent text-blue-400 outline-none font-bold">
        <option value="2.0">สนามกลางแจ้ง (Open Field)</option>
        <option value="2.7">สนามกีฬาคนเยอะ (Crowded Stadium)</option>
        <option value="3.5">ในอาคาร (Indoor/Obstacles)</option>
      </select>
    </div>

    <button onclick="startRadarScan()" id="radarBtn" class="w-full mb-6 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-lg uppercase tracking-wider transition active:scale-95">
      Start Radar Scan
    </button>

    <div class="space-y-2">
      <div class="flex justify-between items-center px-2 mb-2">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Live Athletes (Top 10)</h2>
        <span class="text-[10px] text-gray-600" id="deviceCount">Devices: 0</span>
      </div>
      
      <div id="deviceList" class="space-y-2">
        <p id="placeholder" class="text-center py-10 text-gray-700 text-sm italic">Waiting for signals...</p>
      </div>
    </div>

    <div class="mt-8 p-4 bg-gray-900 rounded-2xl border border-gray-800 text-[10px] text-gray-500 text-center uppercase tracking-tighter leading-tight">
      *กดยกเลิก (Cancel) เมื่อมีหน้าต่างเลือกอุปกรณ์เด้งขึ้นมา เพื่อรันโหมดเรดาร์
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRGLwwocunBFN7i-nBra8uKjet3S4sx1qGDowxsYmrNS6ziPY_Z3UkzNdAE18QNcVV4Q/exec";
    const TX_POWER = -59; 
    let devicesMap = new Map(); // เก็บข้อมูลอุปกรณ์

    async function startRadarScan() {
      const statusLabel = document.getElementById('scanStatus');
      const radarBtn = document.getElementById('radarBtn');

      if (!navigator.bluetooth || !navigator.bluetooth.requestLEScan) {
        alert("Chrome ของคุณยังไม่รองรับ Radar Mode");
        return;
      }

      try {
        statusLabel.innerText = "WAITING...";
        statusLabel.className = "text-[10px] bg-yellow-600 px-3 py-1 rounded-full text-white font-bold";

        const scan = await navigator.bluetooth.requestLEScan({
          acceptAllAdvertisements: true,
          keepRepeatedDevices: true
        });

        statusLabel.innerText = "RADAR ON";
        statusLabel.className = "text-[10px] bg-green-600 px-3 py-1 rounded-full text-white font-bold uppercase";
        radarBtn.innerText = "SCANNING ACTIVE";
        radarBtn.classList.add('radar-pulse');
        radarBtn.disabled = true;

        navigator.bluetooth.addEventListener('advertisementreceived', event => {
          const id = event.device.id;
          const name = event.device.name || "Unknown (" + id.slice(-4) + ")";
          const rssi = event.rssi;
          const envN = parseFloat(document.getElementById('envMode').value);
          const distance = Math.pow(10, (TX_POWER - rssi) / (10 * envN));

          // อัปเดตข้อมูลใน Map
          devicesMap.set(id, { name, rssi, distance, lastSeen: Date.now() });
          
          updateDeviceList();
          
          // ส่งข้อมูลไป Sheets เฉพาะตัวที่อยู่ใกล้มาก (< 3m) และไม่ส่งถี่เกินไป
          if (distance < 3.0 && (!devicesMap.get(id).lastSent || Date.now() - devicesMap.get(id).lastSent > 10000)) {
            sendToSheets(name, rssi, distance.toFixed(1));
            devicesMap.get(id).lastSent = Date.now();
          }
        });

      } catch (error) {
        statusLabel.innerText = "OFF";
        statusLabel.className = "text-[10px] bg-red-900 px-3 py-1 rounded-full text-white font-bold";
        alert("Radar Error: " + error.message);
      }
    }

    function updateDeviceList() {
      const listContainer = document.getElementById('deviceList');
      const placeholder = document.getElementById('placeholder');
      
      // ลบอุปกรณ์ที่หายไปนานกว่า 10 วินาที
      const now = Date.now();
      for (let [id, data] of devicesMap) {
        if (now - data.lastSeen > 10000) devicesMap.delete(id);
      }

      // แปลง Map เป็น Array และเรียงตาม RSSI (แรงสุดอยู่บน)
      const sortedDevices = Array.from(devicesMap.values())
        .sort((a, b) => b.rssi - a.rssi)
        .slice(0, 10);

      if (sortedDevices.length > 0) placeholder.style.display = 'none';

      document.getElementById('deviceCount').innerText = `Devices: ${devicesMap.size}`;

      listContainer.innerHTML = sortedDevices.map((dev, index) => `
        <div class="device-item ${index === 0 ? 'top-1' : ''} bg-gray-900 p-3 rounded-xl flex justify-between items-center border-r border-gray-800 shadow-inner">
          <div class="flex items-center space-x-3">
            <span class="text-xs font-bold text-gray-600 w-4">#${index + 1}</span>
            <div>
              <p class="text-sm font-black ${index === 0 ? 'text-white' : 'text-gray-300'} truncate w-32">${dev.name}</p>
              <p class="text-[9px] text-gray-500 uppercase tracking-widest">${dev.rssi} dBm</p>
            </div>
          </div>
          <div class="text-right">
            <p class="text-lg font-black ${index === 0 ? 'text-red-500' : 'text-blue-400'}">${dev.distance.toFixed(1)}<span class="text-[10px] ml-1 font-normal text-gray-500">m</span></p>
            <div class="w-16 bg-gray-800 h-1 rounded-full mt-1 overflow-hidden">
               <div class="bg-blue-500 h-full" style="width: ${Math.max(0, 100 + dev.rssi)}%"></div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function sendToSheets(name, rssi, dist) {
      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({ name, hr: "Radar Top10", distance: dist, rssi: rssi })
      });
    }
  </script>
</body>
</html>
