<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar v3.1</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; }
    .status-on { background-color: #059669; }
    .status-off { background-color: #991b1b; }
    .item-card { background-color: #111827; border-left: 4px solid #ef4444; margin-bottom: 8px; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body class="p-4">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
      <h1 class="text-lg font-bold text-red-500">TEAM RADAR v3.1</h1>
      <div id="statusTag" class="status-off text-[10px] px-2 py-1 rounded-full font-bold">OFF</div>
    </header>

    <div class="grid grid-cols-2 gap-2 mb-4">
      <div class="bg-gray-900 p-2 rounded-lg">
        <label class="text-[9px] text-gray-500 uppercase block mb-1">Environment</label>
        <select id="envMode" class="w-full bg-transparent text-xs text-blue-400 outline-none">
          <option value="2.0">Open Field</option>
          <option value="2.7">Stadium</option>
          <option value="3.5">Indoor</option>
        </select>
      </div>
      <div class="bg-gray-900 p-2 rounded-lg">
        <label class="text-[9px] text-gray-500 uppercase block mb-1">White List</label>
        <input type="text" id="filterInput" placeholder="Name..." class="w-full bg-transparent text-xs outline-none">
      </div>
    </div>

    <div class="flex space-x-2 mb-6">
      <button id="startBtn" class="flex-1 bg-blue-600 py-4 rounded-xl font-bold uppercase text-sm">Start Radar</button>
      <button id="stopBtn" class="hidden flex-none bg-gray-700 px-6 py-4 rounded-xl font-bold uppercase text-sm">Stop</button>
    </div>

    <div id="listArea">
      <div class="flex justify-between text-[10px] text-gray-500 mb-2 uppercase px-1">
        <span>Athlete List</span>
        <span id="deviceCount">Count: 0</span>
      </div>
      <div id="deviceList">
        <p class="text-center text-gray-700 py-10 italic">Ready to Scan...</p>
      </div>
    </div>
  </div>

  <script>
    const TX_POWER = -59;
    let devices = new Map();
    let bluetoothScan = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusTag = document.getElementById('statusTag');
    const deviceList = document.getElementById('deviceList');

    startBtn.onclick = async () => {
      try {
        bluetoothScan = await navigator.bluetooth.requestLEScan({
          acceptAllAdvertisements: true,
          keepRepeatedDevices: true
        });

        statusTag.innerText = "ON";
        statusTag.className = "status-on text-[10px] px-2 py-1 rounded-full font-bold";
        startBtn.innerText = "SCANNING...";
        startBtn.disabled = true;
        stopBtn.classList.remove('hidden');

        navigator.bluetooth.addEventListener('advertisementreceived', handleSignal);
      } catch (e) {
        alert("Error: " + e.message);
      }
    };

    stopBtn.onclick = () => {
      if (bluetoothScan) bluetoothScan.stop();
      location.reload(); // รีเฟรชหน้าจอเพื่อล้างค่าทั้งหมดให้หายค้าง
    };

    function handleSignal(event) {
      const id = event.device.id;
      const name = event.device.name || "Unknown (" + id.slice(-4) + ")";
      const rssi = event.rssi;
      const env = parseFloat(document.getElementById('envMode').value);
      const filter = document.getElementById('filterInput').value.toLowerCase();

      if (filter && !name.toLowerCase().includes(filter)) return;

      const dist = Math.pow(10, (TX_POWER - rssi) / (10 * env));
      devices.set(id, { name, rssi, dist, time: Date.now() });

      render();
    }

    function render() {
      const now = Date.now();
      for (let [id, data] of devices) {
        if (now - data.time > 8000) devices.delete(id);
      }

      const sorted = Array.from(devices.values()).sort((a, b) => a.dist - b.dist).slice(0, 10);
      document.getElementById('deviceCount').innerText = "Count: " + devices.size;

      if (sorted.length === 0) {
        deviceList.innerHTML = '<p class="text-center text-gray-700 py-10 italic">Searching...</p>';
        return;
      }

      deviceList.innerHTML = sorted.map((d, i) => `
        <div class="item-card flex justify-between items-center">
          <div>
            <div class="text-sm font-bold">#${i+1} ${d.name}</div>
            <div class="text-[10px] text-gray-500">${d.rssi} dBm</div>
          </div>
          <div class="text-xl font-bold text-red-500">${d.dist.toFixed(1)}m</div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
