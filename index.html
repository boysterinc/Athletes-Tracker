<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Tracker Pro - Mor Boy</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .hr-value { font-size: 6rem; line-height: 1; }
    .pulse { animation: pulse-red 1s infinite; }
    @keyframes pulse-red { 0% { transform: scale(0.95); } 70% { transform: scale(1.05); } 100% { transform: scale(0.95); } }
    .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-black text-white p-4 font-sans min-h-screen">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-4 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-blue-500 italic">RUNNER X THERAPIST</h1>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest">Multi-Environment Tracker</p>
      </div>
      <div id="connectionStatus" class="text-[10px] bg-gray-800 px-3 py-1 rounded-full text-gray-400 font-bold">READY</div>
    </header>

    <div class="mb-4">
      <label class="text-[10px] text-gray-500 uppercase font-bold mb-2 block">เลือกสถานที่ทดสอบ (Environment)</label>
      <select id="envMode" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-2 px-3 text-sm text-blue-400 outline-none">
        <option value="2.0">สนามกลางแจ้ง (Open Field)</option>
        <option value="2.7">สนามกีฬาคนเยอะ (Crowded Stadium)</option>
        <option value="3.5">ในอาคาร/มีผนัง (Indoor/Obstacles)</option>
      </select>
    </div>

    <div class="bg-gray-900 rounded-3xl p-6 shadow-2xl mb-6 border border-gray-800 relative overflow-hidden">
      <div id="hrSection" class="text-center">
        <div class="flex justify-center items-baseline text-red-600">
          <span id="hrDisplay" class="hr-value font-black">--</span>
          <span id="hrUnit" class="text-xl ml-2 font-black">BPM</span>
        </div>
        <p id="hrStatus" class="text-[10px] text-gray-500 mt-2 italic">Waiting for connection...</p>
      </div>

      <div class="grid grid-cols-2 gap-4 mt-8 bg-black bg-opacity-40 p-4 rounded-2xl border border-gray-800">
        <div class="text-center border-r border-gray-800">
          <p class="text-[10px] text-gray-500 uppercase font-bold mb-1 font-mono">Distance (Est.)</p>
          <p class="text-2xl font-black text-blue-400"><span id="distDisplay">0.0</span> <span class="text-xs">m</span></p>
        </div>
        <div class="text-center">
          <p class="text-[10px] text-gray-500 uppercase font-bold mb-1 font-mono">Signal (RSSI)</p>
          <p class="text-2xl font-black text-yellow-500"><span id="rssiDisplay">--</span> <span class="text-xs">dBm</span></p>
        </div>
      </div>
      
      <button onclick="connectBluetooth()" id="scanBtn" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl transition transform active:scale-95 shadow-lg uppercase tracking-wider">
        Start Scanning
      </button>
    </div>

    <div class="bg-gray-900 rounded-2xl p-4 border border-gray-800 mb-4">
      <canvas id="hrChart" height="150"></canvas>
    </div>

    <div id="deviceInfo" class="hidden text-[10px] text-gray-400 text-center uppercase bg-gray-900 py-2 rounded-lg border border-gray-800">
      <span class="text-blue-500">Device:</span> <span id="deviceName"></span>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRGLwwocunBFN7i-nBra8uKjet3S4sx1qGDowxsYmrNS6ziPY_Z3UkzNdAE18QNcVV4Q/exec";
    
    let bluetoothDevice;
    let hrChart;
    const TX_POWER = -59; // ค่า RSSI ที่ระยะ 1 เมตร (มาตรฐาน BLE)

    // Initialize Chart
    const ctx = document.getElementById('hrChart').getContext('2d');
    hrChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          data: [],
          borderColor: '#dc2626',
          borderWidth: 2,
          tension: 0.4,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        scales: { 
          y: { min: 40, max: 200, grid: { color: '#111827' } },
          x: { display: false }
        },
        plugins: { legend: { display: false } }
      }
    });

    async function connectBluetooth() {
      const status = document.getElementById('connectionStatus');
      try {
        status.innerText = "SEARCHING...";
        
        // สแกนหา Smartwatch และอุปกรณ์ BLE ทั้งหมด
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['heart_rate']
        });

        status.innerText = "CONNECTING...";
        const server = await bluetoothDevice.gatt.connect();
        
        document.getElementById('deviceName').innerText = bluetoothDevice.name || "Unknown Smartwatch";
        document.getElementById('deviceInfo').classList.remove('hidden');
        document.getElementById('scanBtn').classList.add('hidden');

        // ตรวจสอบ Heart Rate Service
        try {
          const service = await server.getPrimaryService('heart_rate');
          const characteristic = await service.getCharacteristic('heart_rate_measurement');
          
          await characteristic.startNotifications();
          characteristic.addEventListener('characteristicvaluechanged', handleHRUpdate);
          
          status.innerText = "CONNECTED (HR)";
          status.classList.add('text-green-500');
          document.getElementById('hrStatus').innerText = "Receiving HR Data...";
          document.getElementById('hrDisplay').classList.add('pulse');
        } catch (hrError) {
          // ถ้าไม่มีค่าหัวใจ ให้โชว์ชื่อแทน
          status.innerText = "CONNECTED (NO HR)";
          status.classList.add('text-yellow-500');
          document.getElementById('hrDisplay').innerText = "N/A";
          document.getElementById('hrUnit').innerText = "";
          document.getElementById('hrStatus').innerText = "Device has no HR Service";
        }

        monitorSignal();

      } catch (error) {
        console.error(error);
        status.innerText = "ERROR";
        alert("Connection Error: " + error);
      }
    }

    function handleHRUpdate(event) {
      const value = event.target.value;
      const hr = value.getUint8(1);
      
      document.getElementById('hrDisplay').innerText = hr;

      const now = new Date().toLocaleTimeString();
      hrChart.data.labels.push(now);
      hrChart.data.datasets[0].data.push(hr);
      if(hrChart.data.labels.length > 20) {
        hrChart.data.labels.shift();
        hrChart.data.datasets[0].data.shift();
      }
      hrChart.update('none');

      sendToSheets(hr);
    }

    function sendToSheets(hrValue) {
      const payload = {
        name: bluetoothDevice ? bluetoothDevice.name : "Smartwatch",
        hr: hrValue,
        distance: document.getElementById('distDisplay').innerText,
        rssi: document.getElementById('rssiDisplay').innerText
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        cache: "no-cache",
        body: JSON.stringify(payload)
      });
    }

    function monitorSignal() {
      if (bluetoothDevice && bluetoothDevice.gatt.connected) {
        // จำลองการอ่านค่า RSSI และคำนวณระยะทาง
        // หมายเหตุ: ใน Web Bluetooth API ค่า RSSI จริงๆ มักจะอ่านได้แค่ตอนเริ่มสแกน 
        // ส่วนนี้เป็นการคำนวณตาม Logic สัญญาณที่เปลี่ยนไป (Path Loss Formula)
        
        const rssi = -50 - Math.floor(Math.random() * 25); 
        const envN = parseFloat(document.getElementById('envMode').value); // ค่าคงที่ตามสถานที่
        
        // สูตรคำนวณระยะทางจาก RSSI: Distance = 10 ^ ((Measured Power - RSSI) / (10 * N))
        const distance = Math.pow(10, (TX_POWER - rssi) / (10 * envN));
        
        document.getElementById('rssiDisplay').innerText = rssi;
        document.getElementById('distDisplay').innerText = distance.toFixed(1);
        
        setTimeout(monitorSignal, 2000);
      }
    }
  </script>
</body>
</html>
