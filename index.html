<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar Pro - Mor Boy</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .radar-pulse { animation: radar-wave 2s infinite ease-out; }
    @keyframes radar-wave { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 100% { box-shadow: 0 0 0 30px rgba(59, 130, 246, 0); } }
    body { background-color: #000; color: #fff; }
    .glass-card { background: rgba(17, 24, 39, 0.9); border: 1px solid #1f2937; }
  </style>
</head>
<body class="p-4 font-sans min-h-screen">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-blue-500">ATHLETE RADAR</h1>
        <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Passive Scanning Mode</p>
      </div>
      <div id="scanStatus" class="text-[10px] bg-red-900 px-3 py-1 rounded-full text-white font-bold">OFF</div>
    </header>

    <div class="mb-4">
      <label class="text-[10px] text-gray-500 uppercase font-bold mb-2 block">Environment Mode</label>
      <select id="envMode" class="w-full bg-gray-900 border border-gray-700 rounded-xl py-4 px-3 text-sm text-blue-400 outline-none">
        <option value="2.0">สนามกลางแจ้ง (Open Field)</option>
        <option value="2.7">สนามกีฬาคนเยอะ (Crowded Stadium)</option>
        <option value="3.5">ในอาคาร (Indoor/Obstacles)</option>
      </select>
    </div>

    <button onclick="startRadarScan()" id="radarBtn" class="w-full mb-6 bg-blue-600 hover:bg-blue-500 text-white font-black py-6 rounded-3xl shadow-lg uppercase tracking-widest transition active:scale-95">
      Start Passive Radar
    </button>

    <div id="resultsArea" class="space-y-4">
      <div class="bg-gray-900 rounded-3xl p-6 border border-gray-700 relative overflow-hidden" id="mainDisplay">
        <p class="text-[10px] text-gray-500 uppercase font-bold mb-2">Nearest Athlete</p>
        <h2 id="nearestName" class="text-3xl font-black text-white italic truncate">Waiting...</h2>
        
        <div class="grid grid-cols-2 gap-4 mt-6">
          <div class="bg-black bg-opacity-60 p-4 rounded-2xl border border-gray-800">
            <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Distance</p>
            <p class="text-2xl font-black text-blue-400"><span id="distDisplay">--</span> <span class="text-xs font-normal text-gray-500">m</span></p>
          </div>
          <div class="bg-black bg-opacity-60 p-4 rounded-2xl border border-gray-800">
            <p class="text-[10px] text-gray-400 uppercase font-bold mb-1">Signal (RSSI)</p>
            <p class="text-2xl font-black text-yellow-500"><span id="rssiDisplay">--</span> <span class="text-xs font-normal text-gray-500">dBm</span></p>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 p-4 bg-gray-900 rounded-2xl border border-dashed border-gray-700">
      <p class="text-[11px] text-gray-400 leading-relaxed text-center">
        <span class="text-blue-500 font-bold">วิธีใช้งาน:</span> เปิด GPS และ Chrome Flag ให้เรียบร้อย <br>
        จากนั้นกดปุ่มสีน้ำเงิน หากมีปุ่มให้เลือกอุปกรณ์เด้งขึ้นมา <br>
        <span class="text-red-500">ให้กด "ยกเลิก (Cancel)" ทันที</span> เพื่อเข้าสู่โหมดเรดาร์
      </p>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRGLwwocunBFN7i-nBra8uKjet3S4sx1qGDowxsYmrNS6ziPY_Z3UkzNdAE18QNcVV4Q/exec";
    const TX_POWER = -59; 

    async function startRadarScan() {
      const statusLabel = document.getElementById('scanStatus');
      const radarBtn = document.getElementById('radarBtn');

      // 1. ตรวจสอบ Browser Support
      if (!navigator.bluetooth || !navigator.bluetooth.requestLEScan) {
        alert("ขออภัย! Chrome บนมือถือคุณยังไม่รองรับระบบ Radar\nกรุณาเปิด chrome://flags/#enable-experimental-web-platform-features");
        return;
      }

      try {
        // 2. เปลี่ยนสถานะเป็นรอดำเนินการ
        statusLabel.innerText = "WAITING...";
        statusLabel.className = "text-[10px] bg-yellow-600 px-3 py-1 rounded-full text-white font-bold";

        // 3. เริ่มการสแกน (ขั้นตอนนี้ Chrome จะถามสิทธิ์)
        const scan = await navigator.bluetooth.requestLEScan({
          acceptAllAdvertisements: true,
          keepRepeatedDevices: true
        });

        // 4. ถ้าผ่านมาถึงตรงนี้ แสดงว่าสำเร็จ
        statusLabel.innerText = "RADAR ON";
        statusLabel.className = "text-[10px] bg-green-600 px-3 py-1 rounded-full text-white font-bold";
        radarBtn.innerText = "SCANNING ACTIVE";
        radarBtn.classList.add('radar-pulse');
        radarBtn.disabled = true;

        console.log("Passive Radar is now active.");

        // 5. ดักจับสัญญาณที่ลอยเข้ามา
        navigator.bluetooth.addEventListener('advertisementreceived', event => {
          const deviceName = event.device.name || "Beacon (" + event.device.id.slice(-4) + ")";
          const rssi = event.rssi;
          const envN = parseFloat(document.getElementById('envMode').value);
          
          // คำนวณระยะทางจาก RSSI
          const distance = Math.pow(10, (TX_POWER - rssi) / (10 * envN));

          // อัปเดตข้อมูลบนหน้าจอ
          document.getElementById('nearestName').innerText = deviceName;
          document.getElementById('rssiDisplay').innerText = rssi;
          document.getElementById('distDisplay').innerText = distance.toFixed(1);
          
          // บันทึกลง Google Sheets อัตโนมัติเมื่ออยู่ใกล้ (น้อยกว่า 4 เมตร)
          if (distance < 4.0) {
            sendToSheets(deviceName, rssi, distance.toFixed(1));
          }
        });

      } catch (error) {
        console.error(error);
        statusLabel.innerText = "OFF";
        statusLabel.className = "text-[10px] bg-red-900 px-3 py-1 rounded-full text-white font-bold";
        alert("ไม่สามารถรันเรดาร์ได้: " + error.message);
      }
    }

    function sendToSheets(name, rssi, dist) {
      const payload = {
        name: name,
        hr: "Radar Mode",
        distance: dist,
        rssi: rssi
      };

      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(payload)
      });
    }
  </script>
</body>
</html>
