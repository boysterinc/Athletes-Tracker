<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar Pro v4.2 - Mor Boy Edition</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; font-family: sans-serif; }
    .status-on { background-color: #059669; }
    .status-off { background-color: #991b1b; }
    .item-card { background: #111827; border-left: 4px solid #3b82f6; margin-bottom: 8px; padding: 12px; border-radius: 12px; transition: all 0.2s; cursor: pointer; }
    .item-card:active { transform: scale(0.98); background: #1f2937; }
    .whitelist-card { border-left: 4px solid #ef4444 !important; background-color: #1e1b4b !important; }
    .id-text { font-family: monospace; color: #6b7280; font-size: 10px; }
    .tag-team { background: #ef4444; color: white; font-size: 8px; padding: 2px 4px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
  </style>
</head>
<body class="p-4">

  <div class="max-w-md mx-auto">
    <header class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
      <div>
        <h1 class="text-lg font-bold text-blue-500 italic uppercase">Team Radar v4.2</h1>
        <p class="text-[9px] text-gray-500 uppercase">Registered & Auto-Save Mode</p>
      </div>
      <div id="statusTag" class="status-off text-[10px] px-2 py-1 rounded-full font-bold uppercase">OFF</div>
    </header>

    <div class="mb-4 bg-gray-900 p-4 rounded-2xl border border-gray-800">
      <div class="flex justify-between items-center mb-2">
        <label class="text-[10px] text-red-500 uppercase font-black italic">Team Whitelist (Registered)</label>
        <button onclick="clearTeam()" class="text-[9px] text-gray-500 underline">Clear All</button>
      </div>
      <div id="teamBadges" class="flex flex-wrap gap-2 min-h-[30px]">
        </div>
    </div>

    <div class="grid grid-cols-2 gap-2 mb-4">
      <div class="bg-gray-900 p-2 rounded-xl border border-gray-800">
        <label class="text-[9px] text-gray-400 block mb-1 font-bold">Environment</label>
        <select id="envMode" class="w-full bg-transparent text-xs text-blue-400 font-bold outline-none">
          <option value="2.0">Open Field</option>
          <option value="2.7">Stadium</option>
          <option value="3.5">Indoor</option>
        </select>
      </div>
      <div class="bg-gray-900 p-2 rounded-xl border border-gray-800">
        <label class="text-[9px] text-gray-400 block mb-1 font-bold">Quick Search</label>
        <input type="text" id="quickSearch" placeholder="ค้นหาชื่อ/ID..." class="w-full bg-transparent text-xs text-white outline-none">
      </div>
    </div>

    <button id="startBtn" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-sm shadow-lg mb-6 active:scale-95 transition">Start Radar</button>
    <button id="stopBtn" class="hidden w-full bg-gray-800 py-4 rounded-2xl font-black uppercase text-sm mb-6">Stop & Reset</button>

    <div id="listArea">
      <div class="flex justify-between text-[10px] text-gray-500 mb-2 uppercase font-bold px-1 italic">
        <span>Tap to Register Athlete</span>
        <span id="deviceCount">0 Found</span>
      </div>
      <div id="deviceList" class="space-y-2 text-center py-10 text-gray-800 italic">Ready...</div>
    </div>
  </div>

  <script>
    const TX_POWER = -59;
    let devices = new Map();
    let teamList = []; // [{id: '', name: ''}]
    let bluetoothScan = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusTag = document.getElementById('statusTag');
    const deviceList = document.getElementById('deviceList');
    const teamBadges = document.getElementById('teamBadges');

    // โหลดข้อมูลทีมจาก Memory
    window.onload = () => {
      const saved = localStorage.getItem('morboy_team_v2');
      if (saved) {
        teamList = JSON.parse(saved);
        renderTeamBadges();
      }
    };

    function renderTeamBadges() {
      if (teamList.length === 0) {
        teamBadges.innerHTML = '<span class="text-[10px] text-gray-700 italic">No registered athletes.</span>';
        return;
      }
      teamBadges.innerHTML = teamList.map((m, index) => `
        <div class="bg-blue-900/50 border border-blue-500 px-2 py-1 rounded-lg flex items-center space-x-1">
          <span class="text-[10px] font-bold">${m.name.slice(0,10)}</span>
          <button onclick="removeMember(${index})" class="text-red-500 font-black ml-1">×</button>
        </div>
      `).join('');
    }

    function removeMember(index) {
      teamList.splice(index, 1);
      saveAndRefresh();
    }

    function clearTeam() {
      if(confirm('Clear all registered athletes?')) {
        teamList = [];
        saveAndRefresh();
      }
    }

    function saveAndRefresh() {
      localStorage.setItem('morboy_team_v2', JSON.stringify(teamList));
      renderTeamBadges();
      render();
    }

    // ฟังก์ชันสำคัญ: กดปุ๊บ ลงทะเบียนปั๊บ
    function registerDevice(id, name) {
      // เช็คว่ามีในลิสต์หรือยัง
      if (teamList.some(m => m.id === id)) {
        alert('This device is already registered.');
        return;
      }
      teamList.push({ id, name });
      saveAndRefresh();
    }

    startBtn.onclick = async () => {
      try {
        bluetoothScan = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: true });
        statusTag.innerText = "ON";
        statusTag.className = "status-on text-[10px] px-2 py-1 rounded-full font-bold";
        startBtn.classList.add('hidden');
        stopBtn.classList.remove('hidden');
        navigator.bluetooth.addEventListener('advertisementreceived', handleSignal);
      } catch (e) { alert(e); }
    };

    stopBtn.onclick = () => location.reload();

    function handleSignal(event) {
      const id = event.device.id;
      const name = event.device.name || "Unknown";
      const rssi = event.rssi;
      const env = parseFloat(document.getElementById('envMode').value);
      const search = document.getElementById('quickSearch').value.toLowerCase();

      const dist = Math.pow(10, (TX_POWER - rssi) / (10 * env));
      
      // ตรวจสอบสถานะ White List (Team)
      const isTeam = teamList.some(m => m.id === id || (m.name !== 'Unknown' && m.name === name));

      // กรองการค้นหา
      if (search && !name.toLowerCase().includes(search) && !id.toLowerCase().includes(search)) return;

      devices.set(id, { id, name, rssi, dist, isTeam, time: Date.now() });
      render();
    }

    function render() {
      const now = Date.now();
      for (let [id, data] of devices) {
        if (now - data.time > 8000) devices.delete(id);
      }

      const all = Array.from(devices.values());
      const teamItems = all.filter(d => d.isTeam);
      const generalItems = all.filter(d => !d.isTeam).sort((a, b) => a.dist - b.dist);

      const displayItems = [...teamItems, ...generalItems].slice(0, 15);
      document.getElementById('deviceCount').innerText = `${devices.size} Found`;

      if (displayItems.length === 0) {
        deviceList.innerHTML = '<p class="text-gray-800 py-10 italic">Scanning...</p>';
        return;
      }

      deviceList.innerHTML = displayItems.map((d) => `
        <div onclick="registerDevice('${d.id}', '${d.name}')" class="item-card ${d.isTeam ? 'whitelist-card' : ''} flex justify-between items-center">
          <div class="flex-1 overflow-hidden pr-2 text-left">
            <div class="flex items-center space-x-2">
              ${d.isTeam ? '<span class="tag-team">Athlete</span>' : ''}
              <span class="text-sm font-black truncate">${d.name}</span>
            </div>
            <div class="id-text">${d.isTeam ? '<span class="text-red-500 font-bold">' + d.id + '</span>' : d.id}</div>
            <div class="text-[9px] text-gray-600 font-mono italic">${d.rssi} dBm</div>
          </div>
          <div class="text-right">
            <div class="text-2xl font-black ${d.isTeam ? 'text-red-500' : 'text-blue-400'}">${d.dist.toFixed(1)}<span class="text-[10px] ml-1 text-gray-500 font-normal">m</span></div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
