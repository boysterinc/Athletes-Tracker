<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Radar v5.7 - PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3b82f6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1085/1085493.png">

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
    .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 900; }
    .device-name { color: #FFFFFF !important; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; }
    .id-text-full { font-family: monospace; color: #9ca3af; font-size: 9px; line-height: 1.1; margin-top: 2px; word-break: break-all; }
    .item-card { background: #111827; border-left: 5px solid #374151; margin-bottom: 6px; padding: 12px; border-radius: 12px; cursor: pointer; }
    .whitelist-card { border-left: 5px solid #ef4444 !important; background-color: #1e1b4b !important; }
    .highlight-card { border-left: 5px solid #fbbf24 !important; background-color: #451a03 !important; }
    .team-badge { background: #1e1b4b; border: 1px solid #3b82f6; color: #fff; padding: 3px 10px; border-radius: 10px; font-size: 10px; font-weight: bold; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: #1f2937; padding: 24px; width: 100%; max-width: 360px; border-radius: 24px; border: 1px solid #374151; }
    .progress-bar { height: 4px; background: #374151; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #3b82f6; width: 0%; transition: width 1s linear; }
  </style>
</head>
<body class="p-4">

  <div class="max-w-md mx-auto">
    <header class="mb-4">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-black text-blue-500 italic uppercase">Team Radar v5.7</h1>
        <div id="statusTag" class="bg-red-900 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase">OFF</div>
      </div>
      
      <nav class="flex border-b border-gray-800">
        <button onclick="switchTab('radar')" id="tabRadarBtn" class="flex-1 py-3 text-xs uppercase font-bold tab-active">Radar Monitor</button>
        <button onclick="switchTab('screening')" id="tabScreenBtn" class="flex-1 py-3 text-xs uppercase font-bold text-gray-500">Smart Screening</button>
      </nav>
    </header>

    <div class="mb-4 bg-gray-900 p-3 rounded-xl border border-gray-800">
      <div class="flex justify-between items-center mb-2">
        <label class="text-[9px] text-red-500 font-black italic">CONFIRMED TEAM</label>
        <button onclick="clearTeam()" class="text-[9px] text-gray-600 underline">Clear All</button>
      </div>
      <div id="teamBadges" class="flex flex-wrap gap-2"></div>
    </div>

    <div id="radarSection" class="tab-content">
      <div class="grid grid-cols-3 gap-2 mb-3">
        <div class="bg-gray-800 p-2 rounded-lg border border-gray-700">
          <label class="text-[8px] text-gray-400 block font-bold mb-1">ENV</label>
          <select id="envMode" class="w-full bg-transparent text-xs text-blue-400 font-black outline-none">
            <option value="2.0">Open</option><option value="2.7">Stadium</option><option value="3.5">Indoor</option>
          </select>
        </div>
        <div class="bg-gray-800 p-2 rounded-lg border border-gray-700">
          <label class="text-[8px] text-gray-400 block font-bold mb-1">SHOW</label>
          <select id="displayLimit" class="w-full bg-transparent text-xs text-green-400 font-black outline-none" onchange="render()">
            <option value="10">Top 10</option><option value="20">Top 20</option><option value="30">Top 30</option>
          </select>
        </div>
        <div class="bg-gray-800 p-2 rounded-lg border border-gray-700">
          <label class="text-[8px] text-gray-400 block font-bold mb-1">SEARCH</label>
          <input id="quickSearch" type="text" placeholder="..." class="w-full bg-transparent text-xs text-white outline-none">
        </div>
      </div>

      <button id="startBtn" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase text-sm mb-2 shadow-lg">Start Radar</button>
      <button id="stopBtn" class="w-full bg-gray-800 py-2 rounded-xl font-bold uppercase text-[10px] mb-4 border border-gray-700 opacity-60">Stop & Refresh</button>

      <div class="flex justify-between text-[10px] text-gray-500 mb-2 font-black italic px-1 uppercase">
        <span>Nearby Devices</span>
        <span id="deviceCount">Waiting...</span>
      </div>
      <div id="deviceList" class="space-y-1.5"></div>
    </div>

    <div id="screeningSection" class="tab-content hidden">
      <div class="bg-gray-900 p-4 rounded-2xl border border-yellow-900/50 mb-4 shadow-xl">
        <h3 class="text-yellow-500 font-black text-xs uppercase italic mb-4">Smart Box Screening (Calibrate)</h3>
        <div class="flex items-center justify-between mb-4 bg-black/30 p-3 rounded-lg">
          <label class="text-[10px] text-gray-400 font-bold uppercase">Target Watches In Box</label>
          <input id="targetCount" type="number" value="1" min="1" max="10" class="w-12 bg-gray-800 border border-gray-600 rounded text-center text-white font-bold">
        </div>
        <div id="filterStatus" class="hidden mb-4">
          <div class="flex justify-between text-[10px] mb-1 uppercase font-bold">
            <span id="stepLabel" class="text-yellow-500">Phase 1: Stay Close (< 30cm)</span>
            <span id="timerLabel">30s</span>
          </div>
          <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        </div>
        <button id="screenBtn" class="w-full bg-yellow-600 py-4 rounded-xl font-black uppercase text-xs shadow-lg">Start Smart Screening</button>
      </div>
      <div id="screeningList" class="space-y-1.5 opacity-60"></div>
    </div>
  </div>

  <div id="mapModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 class="text-blue-500 font-black text-lg mb-1 uppercase italic border-b border-gray-700 pb-2">Athlete Mapping</h2>
      <div id="athleteOptions" class="my-4 space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      <div class="border-t border-gray-700 pt-4">
        <button onclick="promptNewAthlete()" class="w-full bg-blue-600 py-3 rounded-xl font-bold uppercase text-xs mb-2">New Athlete</button>
        <button onclick="closeModal()" class="w-full bg-gray-700 py-3 rounded-xl font-bold uppercase text-xs">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => console.log("PWA Active"));
    }

    // --- โค้ด Bluetooth Logic เดิม ---
    const TX_POWER = -59;
    let devices = new Map();
    let teamList = [];
    let bluetoothScan = null;
    let screeningMode = "OFF";
    let screenTimer = 0;
    let candidates = new Map();
    let currentMappingID = null;

    window.onload = () => {
      const saved = localStorage.getItem('morboy_team_v5_7');
      if (saved) { try { teamList = JSON.parse(saved); renderTeamBadges(); } catch(e) { teamList = []; } }
    };

    function switchTab(tab) {
      document.getElementById('radarSection').classList.toggle('hidden', tab !== 'radar');
      document.getElementById('screeningSection').classList.toggle('hidden', tab !== 'screening');
      document.getElementById('tabRadarBtn').className = `flex-1 py-3 text-xs uppercase font-bold ${tab === 'radar' ? 'tab-active' : 'text-gray-500'}`;
      document.getElementById('tabScreenBtn').className = `flex-1 py-3 text-xs uppercase font-bold ${tab === 'screening' ? 'tab-active' : 'text-gray-500'}`;
    }

    function renderTeamBadges() {
      const container = document.getElementById('teamBadges');
      if (teamList.length === 0) { container.innerHTML = '<span class="text-[9px] text-gray-700 italic">No team data.</span>'; return; }
      const uniqueNames = [...new Set(teamList.map(m => m.name))];
      container.innerHTML = uniqueNames.map(name => `<div class="team-badge">${name}</div>`).join('');
    }

    async function startService(mode) {
      try {
        if (bluetoothScan) return;
        bluetoothScan = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true, keepRepeatedDevices: true });
        document.getElementById('statusTag').innerText = "ON";
        document.getElementById('statusTag').className = "bg-green-600 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase";
        navigator.bluetooth.addEventListener('advertisementreceived', handleSignal);
        if (mode === 'screen') runScreeningLogic();
        else {
            document.getElementById('startBtn').innerText = "RADAR ACTIVE";
            document.getElementById('startBtn').disabled = true;
        }
      } catch (e) { alert("Error: " + e.message); }
    }

    function runScreeningLogic() {
      screeningMode = "PHASE1"; screenTimer = 30;
      document.getElementById('filterStatus').classList.remove('hidden');
      const countdown = setInterval(() => {
        screenTimer--;
        document.getElementById('progressFill').style.width = ((30 - screenTimer) / 30 * 100) + "%";
        document.getElementById('timerLabel').innerText = screenTimer + "s";
        if (screenTimer === 15) { screeningMode = "PHASE2"; document.getElementById('stepLabel').innerText = "MOVE AWAY!"; }
        if (screenTimer <= 0) { clearInterval(countdown); finishScreening(); }
      }, 1000);
    }

    function handleSignal(event) {
      const id = event.device.id;
      const name = event.device.name || "Unknown";
      devices.set(id, { id, name, rssi: event.rssi, time: Date.now() });
      if (screeningMode === "PHASE1" && event.rssi > -50) {
        if (!candidates.has(id)) candidates.set(id, { initialRSSI: event.rssi, name });
      }
      render();
    }

    function render() {
      const now = Date.now();
      const n = parseFloat(document.getElementById('envMode').value);
      const limit = parseInt(document.getElementById('displayLimit').value);
      for (let [id, data] of devices) { if (now - data.time > 8000) devices.delete(id); }
      const all = Array.from(devices.values()).map(d => {
        const m = teamList.find(t => t.id === d.id);
        const dist = Math.pow(10, ((m ? m.tx : TX_POWER) - d.rssi) / (10 * n));
        return { ...d, dist, isTeam: !!m, isCandidate: candidates.has(d.id) };
      });
      const sorted = all.sort((a, b) => a.isTeam === b.isTeam ? a.dist - b.dist : a.isTeam ? -1 : 1);
      document.getElementById('deviceCount').innerText = `TOP ${limit} / TOTAL ${all.length}`;
      document.getElementById('deviceList').innerHTML = sorted.slice(0, limit).map(d => renderCard(d)).join('');
      document.getElementById('screeningList').innerHTML = all.filter(d => d.isCandidate).map(d => renderCard(d)).join('');
    }

    function renderCard(d) {
      return `<div onclick="handleCardClick('${d.id}', '${d.name}')" class="item-card ${d.isTeam ? 'whitelist-card' : (d.isCandidate ? 'highlight-card' : '')} flex justify-between items-center">
        <div class="flex-1 overflow-hidden pr-2">
          <div class="flex items-center space-x-2">
            ${d.isTeam ? '<span class="text-[7px] bg-red-600 px-1 rounded font-black italic">TEAM</span>' : ''}
            <span class="device-name">${d.name}</span>
          </div>
          <div class="id-text-full">${d.id}</div>
        </div>
        <div class="text-right">
          <div class="text-2xl font-black ${d.isTeam ? 'text-red-500' : 'text-blue-500'}">${d.dist.toFixed(1)}m</div>
          <div class="text-[9px] text-gray-500">${d.rssi} dBm</div>
        </div>
      </div>`;
    }

    function finishScreening() {
        const target = parseInt(document.getElementById('targetCount').value);
        const confirmed = [];
        for (let [id, data] of candidates) {
            const current = devices.get(id);
            if (current && Math.abs(current.rssi - data.initialRSSI) < 15) {
                confirmed.push({ id, name: data.name, tx: data.initialRSSI - (10 * 2.0 * -0.5228) });
            }
        }
        teamList = [...teamList, ...confirmed.slice(0, target)];
        saveAndRefresh(); screeningMode = "OFF"; document.getElementById('filterStatus').classList.add('hidden');
        switchTab('radar');
    }

    function handleCardClick(id, name) {
      currentMappingID = id;
      const names = [...new Set(teamList.map(m => m.name))];
      document.getElementById('athleteOptions').innerHTML = names.map(n => `<button onclick="linkToAthlete('${n}')" class="w-full bg-gray-800 p-3 rounded-xl mb-2 text-white font-bold text-xs uppercase">${n}</button>`).join('');
      document.getElementById('mapModal').style.display = 'flex';
    }

    function linkToAthlete(name) { teamList.push({ id: currentMappingID, name, tx: TX_POWER }); saveAndRefresh(); closeModal(); }
    function promptNewAthlete() { const n = prompt("Name:"); if(n) { teamList.push({ id: currentMappingID, name: n, tx: TX_POWER }); saveAndRefresh(); closeModal(); } }
    function saveAndRefresh() { localStorage.setItem('morboy_team_v5_7', JSON.stringify(teamList)); renderTeamBadges(); render(); }
    function closeModal() { document.getElementById('mapModal').style.display = 'none'; }
    function clearTeam() { if(confirm('Clear all?')) { teamList = []; localStorage.removeItem('morboy_team_v5_7'); renderTeamBadges(); render(); } }
    
    document.getElementById('startBtn').addEventListener('click', () => startService('radar'));
    document.getElementById('screenBtn').addEventListener('click', () => startService('screen'));
    document.getElementById('stopBtn').onclick = () => location.reload();
  </script>
</body>
</html>
